name: FSDABridge.jl Docs
on:
  push:
    branches: [main]
    tags: ["FSDABridge-v*"]
    paths: ["packages/FSDAjl/**", ".github/workflows/FSDABridge-Docs.yml"]
  pull_request:
    paths: ["packages/FSDAjl/**", ".github/workflows/FSDABridge-Docs.yml"]
  workflow_dispatch:

concurrency:
  group: fsdabridge-docs-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  docs:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: Install docs dependencies
        run: julia --project=packages/FSDAjl/docs -e 'using Pkg; Pkg.develop(path="packages/FSDAjl"); Pkg.instantiate()'
      - name: Build and deploy
        run: julia --project=packages/FSDAjl/docs packages/FSDAjl/docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
